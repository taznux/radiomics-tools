name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04, macos-latest]
        python-version: ['3.7', '3.9']
        itk-version: ['v4.13.3', 'v5.2.1']

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libboost-dev python3-yaml lcov libvtk7-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install vtk lcov

    - name: Cache ITK
      id: cache-itk
      uses: actions/cache@v4
      with:
        path: |
          ~/itk-${{ matrix.itk-version }}
          ~/itk-${{ matrix.itk-version }}-build
        key: ${{ runner.os }}-itk-${{ matrix.itk-version }}

    - name: Build ITK
      if: steps.cache-itk.outputs.cache-hit != 'true'
      env:
        ITK_SOURCE_DIR: ~/itk-${{ matrix.itk-version }}
        ITK_BUILD_DIR: ~/itk-${{ matrix.itk-version }}-build
        ITK_VERSION: ${{ matrix.itk-version }}
        NUM_THREADS: 4
      run: |
        git clone --branch ${ITK_VERSION} https://github.com/InsightSoftwareConsortium/ITK.git ${ITK_SOURCE_DIR}
        mkdir -p ${ITK_BUILD_DIR}
        cd ${ITK_BUILD_DIR}
        cmake ${ITK_SOURCE_DIR} -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DModule_ITKReview=ON -DModule_LesionSizingToolkit=ON
        make --jobs=$NUM_THREADS --keep-going

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install codecov

    - name: Install TCIAExplorer
      run: |
        cd externals/TCIAExplorer
        python setup.py install
        cd -

    - name: Download test data
      run: python script/download_lungx_tcia.py

    - name: Build and test project
      env:
        ITK_DIR: ~/itk-${{ matrix.itk-version }}-build
      run: |
        mkdir build
        cd build
        cmake .. -DENABLE_COVERAGE=On
        make
        make test

    - name: Run pipeline
      env:
        ITK_DIR: ~/itk-${{ matrix.itk-version }}-build
      run: |
        # The pipeline should be run from the root of the project
        coverage run script/run_lungx.py

    - name: Generate coverage reports
      run: |
        cd build
        make gcov
        make lcov
        cd ..

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        # The user will need to set this secret in the repository settings
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./build/
        files: lcov.info
        fail_ci_if_error: true
